name: Feature request
description: Propose a focused workflow improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What maintainer or delivery problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Primary workflow area
      options:
        - Requirement discovery
        - Architecture and contracts
        - Implementation planning
        - Visual design and evidence
        - Verification and quality
        - Packaging and installation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
