name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/full-stack-development/mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/full-stack-development/mcp-server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          CI: "true"
      - run: npm audit --omit=dev --audit-level=high
